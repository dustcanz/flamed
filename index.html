<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>フレームメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060606;
    --panel:#101010;
    --panel-border:#242422;
    --red:#FF3629;
    --text:#F3F1EA;
    --muted:#7C7C76;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;}
  body{
    min-height:100vh;
    padding:28px 16px 60px;
    background-image:radial-gradient(circle, #1a1a18 1px, transparent 1px);
    background-size:18px 18px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'DotGothic16',monospace;
    color:var(--red);
    font-size:12px;
    letter-spacing:.12em;
  }
  h1{
    font-family:'DotGothic16',monospace;
    font-weight:400;
    font-size:26px;
    letter-spacing:.04em;
    margin:8px 0 6px;
  }
  header p{color:var(--muted);font-size:13px;line-height:1.6;margin:0;}

  .stage{
    border:1px solid var(--panel-border);
    background:linear-gradient(180deg,#0c0c0b,#0a0a09);
    border-radius:4px;
    padding:22px 16px;
    margin-bottom:22px;
    display:flex;
    justify-content:center;
  }
  #canvas{
    width:100%;
    max-width:420px;
    height:auto;
    display:block;
    cursor:pointer;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.8);
  }

  .section{
    border:1px solid var(--panel-border);
    background:var(--panel);
    border-radius:4px;
    padding:18px 16px;
    margin-bottom:14px;
  }
  .step-label{
    font-family:'DotGothic16',monospace;
    font-size:12px;
    color:var(--red);
    letter-spacing:.1em;
    margin-bottom:12px;
    display:block;
  }

  .file-btn{
    width:100%;
    border:1px dashed var(--panel-border);
    background:#0a0a09;
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:13px;
    padding:14px;
    border-radius:3px;
    text-align:center;
    cursor:pointer;
  }
  .file-btn:active{border-color:var(--red);}
  input[type=file]{display:none;}

  label.field{display:block;margin-bottom:14px;}
  label.field:last-child{margin-bottom:0;}
  label.field span{
    display:block;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.08em;
    margin-bottom:6px;
  }
  input[type=text],input[type=url],input[type=number]{
    width:100%;
    background:#0a0a09;
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:'Space Mono',monospace;
    font-size:14px;
    padding:10px 12px;
    border-radius:3px;
    outline:none;
  }
  input:focus{border-color:var(--red);}

  .row2{display:flex;gap:10px;}
  .row2 label.field{flex:1;}

  .link-fetch-row{display:flex;gap:8px;margin-bottom:12px;}
  .link-fetch-row input{flex:1;}
  .btn-small{
    background:#0a0a09;
    border:1px solid var(--panel-border);
    color:var(--text);
    font-family:'DotGothic16',monospace;
    font-size:13px;
    padding:0 16px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-small:active{border-color:var(--red);}
  .btn-small:disabled{color:var(--muted);}

  .status-line{
    font-size:11px;
    color:var(--muted);
    margin-bottom:12px;
    min-height:14px;
  }
  .status-line.ok{color:#7fbf8f;}
  .status-line.err{color:var(--red);}

  .clear-link{
    font-size:11px;
    color:var(--muted);
    text-decoration:underline;
    background:none;border:none;
    cursor:pointer;
    padding:0;
    margin-top:4px;
  }

  details{border:1px solid var(--panel-border);background:var(--panel);border-radius:4px;margin-bottom:14px;}
  summary{
    font-family:'DotGothic16',monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.1em;
    padding:16px;
    cursor:pointer;
  }
  details[open] summary{color:var(--red);}
  .details-body{padding:0 16px 16px;}

  .theme-row{display:flex;gap:8px;margin-bottom:16px;}
  .swatch{
    flex:1;
    border:1px solid var(--panel-border);
    background:#0a0a09;
    color:var(--muted);
    font-family:'Space Mono',monospace;
    font-size:11px;
    padding:10px 4px;
    border-radius:3px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
  }
  .swatch i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid #333;}
  .swatch.active{border-color:var(--red);color:var(--text);}

  .save-btn{
    width:100%;
    background:var(--red);
    color:#0a0a09;
    border:none;
    font-family:'DotGothic16',monospace;
    font-size:15px;
    letter-spacing:.05em;
    padding:15px;
    border-radius:3px;
    cursor:pointer;
  }
  .save-btn:active{opacity:.85;}
  .save-btn:disabled{background:#333;color:var(--muted);}

  footer{text-align:center;color:var(--muted);font-size:10px;margin-top:24px;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">FRAME MAKER</div>
    <h1>写真にフレームを追加</h1>
    <p>画像・リンク・名前と日付を入れると、下部にまとめて表示するフレームを作れます。</p>
  </header>

  <div class="stage">
    <canvas id="canvas"></canvas>
  </div>

  <div class="section">
    <span class="step-label">01 — 画像を選択</span>
    <button class="file-btn" id="fileBtn" type="button">タップして画像を選ぶ</button>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="section">
    <span class="step-label">02 — リンクを追加（任意）</span>
    <div class="link-fetch-row">
      <input type="url" id="urlInput" placeholder="https://vrchat.com/home/world/... など">
      <button class="btn-small" id="fetchBtn" type="button">取得</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <label class="field">
      <span>サイト名</span>
      <input type="text" id="siteNameInput" placeholder="例: VRChat / YouTube" maxlength="30">
    </label>
    <label class="field">
      <span>タイトル</span>
      <input type="text" id="linkTitleInput" placeholder="ワールド名・曲名など" maxlength="80">
    </label>
    <label class="field">
      <span>サムネイル画像（自動取得できない場合はここから手動で）</span>
      <button class="file-btn" id="thumbBtn" type="button">サムネイル画像を選ぶ</button>
      <input type="file" id="thumbInput" accept="image/*">
    </label>
    <button class="clear-link" id="clearLink">リンク情報をクリア</button>
  </div>

  <div class="section">
    <span class="step-label">03 — 名前・日付（任意）</span>
    <div class="row2">
      <label class="field">
        <span>名前</span>
        <input type="text" id="nameInput" placeholder="YOUR NAME" maxlength="24">
      </label>
      <label class="field">
        <span>日付</span>
        <input type="text" id="dateInput" placeholder="2026.08.08" maxlength="16">
      </label>
    </div>
  </div>

  <details>
    <summary>詳細設定 — 余白の調整</summary>
    <div class="details-body">
      <label class="field">
        <span>外枠の余白（px, 基準幅1200pxに対する値）</span>
        <input type="number" id="marginInput" min="0" max="120" step="1">
      </label>
    </div>
  </details>

  <div class="section">
    <span class="step-label">04 — 見た目を選んで保存</span>
    <div class="theme-row">
      <div class="swatch active" data-theme="cream"><i style="background:#E7E2D6"></i>CREAM</div>
      <div class="swatch" data-theme="white"><i style="background:#FFFFFF"></i>WHITE</div>
      <div class="swatch" data-theme="black"><i style="background:#141414"></i>BLACK</div>
    </div>
    <button class="save-btn" id="downloadBtn" disabled>画像を保存</button>
  </div>

  <footer>MADE WITH CLAUDE — 画像はブラウザ内でのみ処理されます</footer>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const fileBtn = document.getElementById('fileBtn');
const fileInput = document.getElementById('fileInput');
const thumbBtn = document.getElementById('thumbBtn');
const thumbInput = document.getElementById('thumbInput');
const urlInput = document.getElementById('urlInput');
const fetchBtn = document.getElementById('fetchBtn');
const statusLine = document.getElementById('statusLine');
const siteNameInput = document.getElementById('siteNameInput');
const linkTitleInput = document.getElementById('linkTitleInput');
const clearLinkBtn = document.getElementById('clearLink');
const nameInput = document.getElementById('nameInput');
const dateInput = document.getElementById('dateInput');
const marginInput = document.getElementById('marginInput');
const downloadBtn = document.getElementById('downloadBtn');
const swatches = document.querySelectorAll('.swatch');

const REF_W = 1200;
const DEFAULT_MARGIN = Math.round(REF_W * 0.026);
marginInput.value = DEFAULT_MARGIN;

let img = null;
let linkImage = null;
let theme = 'cream';

const THEMES = {
  cream: { bg:'#E7E2D6', text:'#161513', muted:'#6b665c', cardBg:'#DAD4C4', border:'#c9c2af' },
  white: { bg:'#FFFFFF', text:'#131313', muted:'#7a7a7a', cardBg:'#F1F1F1', border:'#dcdcdc' },
  black: { bg:'#141414', text:'#F2F0E9', muted:'#8a8a86', cardBg:'#1f1f1e', border:'#33332f' },
};

function openPicker(){ fileInput.click(); }
fileBtn.addEventListener('click', openPicker);
thumbBtn.addEventListener('click', () => thumbInput.click());
canvas.addEventListener('click', () => { if(!img) openPicker(); });

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const image = new Image();
    image.onload = () => {
      img = image;
      fileBtn.textContent = '別の画像に変更する';
      downloadBtn.disabled = false;
      draw();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

thumbInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const image = new Image();
    image.onload = () => {
      linkImage = image;
      thumbBtn.textContent = 'サムネイルを変更する';
      draw();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function setStatus(text, kind){
  statusLine.textContent = text || '';
  statusLine.className = 'status-line' + (kind ? ' ' + kind : '');
}

function loadLinkImage(rawUrl){
  return new Promise((resolve) => {
    const proxied = 'https://images.weserv.nl/?url=' + encodeURIComponent(rawUrl.replace(/^https?:\/\//,''));
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => { linkImage = im; resolve(true); };
    im.onerror = () => { resolve(false); };
    im.src = proxied;
  });
}

fetchBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if(!url){ setStatus('URLを入力してください', 'err'); return; }
  fetchBtn.disabled = true;
  setStatus('取得中…');
  try{
    const api = 'https://api.microlink.io/?url=' + encodeURIComponent(url);
    const res = await fetch(api);
    const json = await res.json();
    if(json.status !== 'success') throw new Error('failed');
    const d = json.data;
    if(!siteNameInput.value){
      siteNameInput.value = d.publisher || (new URL(url).hostname.replace('www.',''));
    }
    if(!linkTitleInput.value){
      linkTitleInput.value = d.title || '';
    }
    const imgUrl = (d.image && d.image.url) || (d.logo && d.logo.url) || '';
    let imgOk = false;
    if(imgUrl){ imgOk = await loadLinkImage(imgUrl); }
    setStatus(imgOk || d.title ? '取得しました。内容は自由に編集できます' : '一部の情報のみ取得できました', 'ok');
  }catch(err){
    setStatus('自動取得できませんでした。下の項目に手動で入力してください', 'err');
  }
  fetchBtn.disabled = false;
  draw();
});

clearLinkBtn.addEventListener('click', () => {
  urlInput.value = '';
  siteNameInput.value = '';
  linkTitleInput.value = '';
  linkImage = null;
  thumbBtn.textContent = 'サムネイル画像を選ぶ';
  setStatus('');
  draw();
});

[siteNameInput, linkTitleInput, nameInput, dateInput, marginInput].forEach(el => {
  el.addEventListener('input', draw);
});

swatches.forEach(sw => {
  sw.addEventListener('click', () => {
    swatches.forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    theme = sw.dataset.theme;
    draw();
  });
});

function wrapAndDrawText(text, x, y, maxWidth, lineHeight, maxLines){
  if(!text) return 0;
  let lines = [];
  let current = '';
  for(let i = 0; i < text.length; i++){
    const test = current + text[i];
    if(ctx.measureText(test).width > maxWidth && current.length > 0){
      lines.push(current);
      current = text[i];
      if(lines.length === maxLines) break;
    } else {
      current = test;
    }
  }
  if(lines.length < maxLines && current) lines.push(current);
  const consumed = lines.join('').length;
  if(lines.length === maxLines && consumed < text.length){
    let last = lines[maxLines - 1];
    while(ctx.measureText(last + '…').width > maxWidth && last.length > 0){
      last = last.slice(0, -1);
    }
    lines[maxLines - 1] = last + '…';
  }
  lines.forEach((line, idx) => ctx.fillText(line, x, y + idx * lineHeight));
  return lines.length;
}

function roundRectClip(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.clip();
}

function draw(){
  const W = REF_W;
  const margin = parseInt(marginInput.value, 10) || DEFAULT_MARGIN;
  const photoW = W - margin * 2;
  const aspect = img ? img.naturalHeight / img.naturalWidth : 0.75;
  const photoH = photoW * aspect;

  const nameVal = nameInput.value.trim();
  const dateVal = dateInput.value.trim();
  const siteVal = siteNameInput.value.trim();
  const titleVal = linkTitleInput.value.trim();
  const hasLink = !!(siteVal || titleVal || linkImage);
  const hasNameRow = !!(nameVal || dateVal);

  const nameRowH = hasNameRow ? W * 0.075 : W * 0.03;
  const linkGap = W * 0.03;
  const linkCardH = W * 0.17;
  const footerH = nameRowH + (hasLink ? linkGap + linkCardH : 0) + margin * 0.8;

  const cardH = margin + photoH + footerH;
  canvas.width = W;
  canvas.height = cardH;

  const t = THEMES[theme];

  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, W, cardH);

  if(img){
    ctx.drawImage(img, margin, margin, photoW, photoH);
  } else {
    ctx.strokeStyle = t.border;
    ctx.setLineDash([10, 10]);
    ctx.lineWidth = 3;
    ctx.strokeRect(margin + 4, margin + 4, photoW - 8, photoH - 8);
    ctx.setLineDash([]);
    ctx.fillStyle = t.muted;
    ctx.font = `${W*0.024}px 'Space Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('タップして画像を追加', W/2, margin + photoH/2);
    ctx.textAlign = 'left';
  }

  let cursorY = margin + photoH;

  // name / date row
  if(hasNameRow){
    const rowTextY = cursorY + nameRowH * 0.62;
    ctx.fillStyle = t.text;
    ctx.font = `700 ${W*0.026}px 'Space Mono', monospace`;
    try { ctx.letterSpacing = '0.5px'; } catch(e){}
    ctx.textAlign = 'left';
    if(nameVal) ctx.fillText(nameVal.toUpperCase(), margin, rowTextY);
    if(dateVal){
      ctx.textAlign = 'right';
      ctx.fillStyle = t.muted;
      ctx.fillText(dateVal, W - margin, rowTextY);
    }
    try { ctx.letterSpacing = '0px'; } catch(e){}
    ctx.textAlign = 'left';
  }
  cursorY += nameRowH;

  // link card
  if(hasLink){
    cursorY += linkGap;
    const cardX = margin;
    const cardY = cursorY;
    const cardW = photoW;
    const thumbSize = linkCardH;
    const radius = W * 0.006;

    ctx.save();
    ctx.fillStyle = t.cardBg;
    roundRectClip(cardX, cardY, cardW, linkCardH, radius);
    ctx.fillRect(cardX, cardY, cardW, linkCardH);
    ctx.restore();

    ctx.save();
    roundRectClip(cardX, cardY, thumbSize, thumbSize, radius);
    if(linkImage){
      const iw = linkImage.naturalWidth || linkImage.width;
      const ih = linkImage.naturalHeight || linkImage.height;
      const scale = Math.max(thumbSize/iw, thumbSize/ih);
      const dw = iw*scale, dh = ih*scale;
      ctx.drawImage(linkImage, cardX + (thumbSize-dw)/2, cardY + (thumbSize-dh)/2, dw, dh);
    } else {
      ctx.fillStyle = t.border;
      ctx.fillRect(cardX, cardY, thumbSize, thumbSize);
      ctx.fillStyle = t.muted;
      ctx.font = `${W*0.018}px 'Space Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('LINK', cardX + thumbSize/2, cardY + thumbSize/2 + 6);
      ctx.textAlign = 'left';
    }
    ctx.restore();

    const textX = cardX + thumbSize + W*0.025;
    const textMaxW = cardW - thumbSize - W*0.05;

    ctx.fillStyle = t.muted;
    ctx.font = `${W*0.017}px 'DotGothic16', monospace`;
    if(siteVal) ctx.fillText(siteVal.toUpperCase(), textX, cardY + linkCardH*0.28);

    ctx.fillStyle = t.text;
    ctx.font = `700 ${W*0.024}px 'Space Mono', monospace`;
    wrapAndDrawText(titleVal, textX, cardY + linkCardH*0.52, textMaxW, W*0.032, 2);

    cursorY += linkCardH;
  }
}

downloadBtn.addEventListener('click', () => {
  try{
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'framed-photo.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  }catch(err){
    setStatus('保存に失敗しました。リンクのサムネイルを手動アップロードした画像に差し替えてから再度お試しください', 'err');
  }
});

if(document.fonts && document.fonts.ready){
  Promise.all([
    document.fonts.load("700 32px 'Space Mono'"),
    document.fonts.load("32px 'DotGothic16'")
  ]).then(draw).catch(draw);
  document.fonts.ready.then(draw);
}
draw();
</script>
</body>
</html>
